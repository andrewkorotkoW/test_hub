<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test_hub — пользователи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <script src="tour.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-content">
  <header id="app-header" class="site-header"></header>
  <main class="page">
    <h1>Пользователи</h1>
    <div id="access-denied" class="error-box" hidden>Этот раздел доступен только ролям qa и superadmin.</div>
    <div id="admin-error" class="error-box" hidden></div>

    <div id="admin-content">
      <div class="card">
        <h2>Заявки на регистрацию</h2>
        <div id="pending-empty" class="muted" hidden>Заявок на рассмотрение нет.</div>
        <div id="pending-rows"></div>
      </div>

      <div class="card">
        <h2>Пользователи</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Логин</th><th>Роль</th><th>ФИО</th><th>Должность</th><th>Проект</th><th>Статус</th><th>Онбординг</th><th></th></tr></thead>
            <tbody id="users-rows"></tbody>
          </table>
        </div>
        <h3>Пользователь</h3>
        <form id="user-form" class="form-row">
          <input id="user-login" placeholder="Логин" required>
          <input id="user-password" placeholder="Пароль" type="password">
          <select id="user-role">
            <option value="qa">qa</option>
            <option value="manager">manager</option>
            <option value="customer">customer</option>
          </select>
          <label><input type="checkbox" id="user-onboarded"> onboarded</label>
          <button type="submit" class="primary">Сохранить</button>
          <button type="button" id="user-cancel-edit" hidden>Отмена</button>
        </form>
      </div>
    </div>
  </main>
    </div>
  </div>

  <script src="users.js"></script>
</body>
</html>
