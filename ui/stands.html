<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Hub — стенды</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <script src="tour.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar"></aside>
    <div class="app-content">
  <header id="app-header" class="site-header"></header>
  <main class="page">
    <h1>Стенды</h1>
    <div id="access-denied" class="error-box" hidden>Этот раздел доступен только ролям qa и superadmin.</div>
    <div id="admin-error" class="error-box" hidden></div>

    <div id="admin-content">
      <div class="card">
        <div class="form-row">
          <label for="admin-project-select">Проект</label>
          <select id="admin-project-select"></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Имя</th><th>URL</th><th>Логин</th><th>Sentry</th><th></th></tr></thead>
            <tbody id="stands-rows"></tbody>
          </table>
        </div>
        <h3>Стенд</h3>
        <form id="stand-form" class="stand-form">
          <input id="stand-name" placeholder="Имя" required>
          <input id="stand-url" placeholder="URL" required>
          <input id="stand-login" placeholder="Логин (необязательно)">
          <input id="stand-sentry-project" placeholder="Sentry project" title="Slug проекта в Sentry, например vshgu-dev-lms (необязательно)">
          <input id="stand-sentry-environment" placeholder="Sentry environment" title="environment в Sentry, например development (необязательно)">
          <label class="stand-form-workers" for="stand-workers">Потоки (pytest -n)
            <input id="stand-workers" type="number" min="0" max="16" step="1" value="0" title="0 — последовательно; на k8s v2 4 потока — 27 мин вместо 1,5 ч">
          </label>
          <div class="stand-form-actions">
            <button type="submit" class="primary">Сохранить</button>
            <button type="button" id="stand-cancel-edit" hidden>Отмена</button>
          </div>
        </form>
        <p class="muted small">Sentry project/environment — для карточки «Ошибки продукта» и вкладки «Sentry» прогона. Потоки: 0 — последовательно; на k8s v2 с несколькими репликами 4 потока — 27 мин вместо 1,5 ч.</p>
      </div>
    </div>
  </main>
    </div>
  </div>

  <script src="stands.js"></script>
</body>
</html>
