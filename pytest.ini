[pytest]
asyncio_mode = auto
# demo/ — самостоятельный pytest-проект демо-сервиса (свой pytest.ini, своя
# фикстура STAND_URL), не часть тестов test_hub — без testpaths bare `pytest -q`
# из корня подхватил бы demo/tests тоже и падал на недоступном демо-сервисе.
testpaths = tests
# PytestUnraisableExceptionWarning по умолчанию эскалируется pytest в ошибку
# того теста, во время которого сработал сборщик мусора — не обязательно
# того, что реально создал объект. У нас это срабатывает на транспорте
# asyncio-subprocess (tests/test_demo_service.py, app/core/runner.py): сам
# процесс корректно завершается и пожинается (proc.wait()), но внутренний
# _SubprocessTransport иногда попадает под GC уже после закрытия своего
# function-scoped event loop (pytest-asyncio) — "RuntimeError: Event loop is
# closed" в __del__. Это не баг нашего кода, но рендеринг этого трейсбека
# упирается в баг CPython 3.11.2 (SystemError: AST constructor recursion
# depth mismatch) и роняет весь прогон INTERNALERROR на случайном тесте.
# Игнорируем именно эту категорию — остальные ошибки/warnings не затронуты.
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
