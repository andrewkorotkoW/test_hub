# Схема продукта ВШГУ для карты покрытия v5 (docs/missions/redesign/coverage_v5/).
# Владелец отклонил v1-v4 (списки/таблицы/дашборды по функциям) и попросил схему
# продукта: экраны блоками со связями, как карта сайта или путь пользователя.
# Этот файл — граф узлов и связей; цвет каждого узла (светофор) вычисляется
# collect_data.py по nodeid реального прогона #39, найденных через feature.tests
# в features_vshgu.yml (node.feature — имя функции в этом файле, единый источник
# префиксов тестов, чтобы не дублировать их здесь).
#
# Layout — вручную (не автолейаут):
#   row/col задают положение узла ВНУТРИ его зоны для варианта J «Карта сайта»
#   (row = глубина в дереве экранов сверху вниз, col = порядковый номер в ряду).
#   Те же row/col переиспользуются для варианта K «Путь пользователя» с
#   развёрнутыми осями: row -> шаг пути (слева направо), col -> дорожка внутри
#   роли (чтобы параллельные ветки не накладывались). Роль/дорожка K = зона узла:
#   ext -> Слушатель, rev -> Проверяющий, adm -> Админ. Зона int (интеграции) в J
#   пристёгивается стрелкой к target-узлу у края схемы; в K — отдельная дорожка
#   «Интеграции» снизу, target-стрелка туда же.
project: VSHGU
zones:
  - {id: ext, label: "Слушатель (внешка)"}
  - {id: rev, label: "Проверяющий / преподаватель"}
  - {id: adm, label: "Админка"}
  - {id: int, label: "Интеграции"}
nodes:
  # ---------------- Внешка (слушатель) ----------------
  - {id: ext_login, label: "Вход", zone: ext, row: 0, col: 0, feature: "Вход"}
  - {id: ext_onboarding, label: "Онбординг", zone: ext, row: 1, col: 0, feature: "Онбординг"}
  - {id: ext_lk, label: "Личный кабинет", zone: ext, row: 2, col: 0, feature: "Личный кабинет"}
  - {id: ext_my_learning, label: "Моё обучение", zone: ext, row: 3, col: 0, feature: "Моё обучение (программы, потоки, модули)"}
  - {id: ext_kb, label: "База знаний", zone: ext, row: 3, col: 1, feature: "База знаний — материалы"}
  - {id: ext_notifications, label: "Уведомления", zone: ext, row: 3, col: 2, feature: "Уведомления"}
  - {id: ext_support, label: "Техподдержка", zone: ext, row: 3, col: 3, feature: "Техподдержка (тикеты)"}
  - {id: ext_profile, label: "Профиль", zone: ext, row: 3, col: 4, feature: "Профиль"}
  - {id: ext_dashboard, label: "Дашборд слушателя", zone: ext, row: 3, col: 5, feature: "Дашборд слушателя"}
  - {id: ext_program, label: "Программа", zone: ext, row: 4, col: 0, feature: "Программа (кабинет слушателя)"}
  - {id: ext_kb_list, label: "Список материалов", zone: ext, row: 4, col: 1, feature: "Список материалов"}
  - {id: ext_ticket, label: "Тикет", zone: ext, row: 4, col: 2, feature: "Тикет (карточка)"}
  - {id: ext_certificates, label: "Мои сертификаты", zone: ext, row: 4, col: 3, feature: "Профиль и сертификаты"}
  - {id: ext_documents, label: "Документы", zone: ext, row: 4, col: 4, feature: "Документы"}
  - {id: ext_tab_schedule, label: "Расписание", zone: ext, row: 5, col: 0, feature: "Вкладка «Расписание» (кабинет)"}
  - {id: ext_tab_courses, label: "Курсы и тесты", zone: ext, row: 5, col: 1, feature: "Вкладка «Курсы и тесты»"}
  - {id: ext_tab_game, label: "Игровая сессия", zone: ext, row: 5, col: 2, feature: "Игровые сессии"}
  - {id: ext_material, label: "Материал", zone: ext, row: 5, col: 3, feature: "Материал (книга, файл, статья, видео, аудио, курс)"}
  - {id: ext_course, label: "Курс (TinCan/SCORM)", zone: ext, row: 6, col: 0, feature: "Курсы TinCan/SCORM"}
  - {id: ext_test, label: "Тест", zone: ext, row: 6, col: 1, feature: "Тест (прохождение)"}
  - {id: ext_pt, label: "Практическое задание", zone: ext, row: 6, col: 2, feature: "Практические задания — прохождение"}
  - {id: ext_poll, label: "Опрос", zone: ext, row: 6, col: 3, feature: "Опросы"}
  - {id: ext_achievements, label: "Достижения", zone: ext, row: 6, col: 4, feature: "Достижения"}
  - {id: ext_rating, label: "Рейтинг", zone: ext, row: 6, col: 5, feature: "Рейтинг"}
  # ---------------- Проверяющий / преподаватель ----------------
  - {id: rev_pt, label: "Практические задания", zone: rev, row: 0, col: 0, feature: "Практические задания — очередь"}
  - {id: rev_proctoring, label: "Прокторинг", zone: rev, row: 0, col: 1, feature: "Прокторинг"}
  - {id: rev_new, label: "Новые", zone: rev, row: 1, col: 0, feature: "Новые (ПЗ)"}
  - {id: rev_done, label: "Отвечено", zone: rev, row: 1, col: 1, feature: "Отвечено (ПЗ)"}
  - {id: rev_review, label: "Проверка ответа", zone: rev, row: 2, col: 0, feature: "Проверка ПЗ"}
  # ---------------- Админка ----------------
  - {id: adm_users_list, label: "Пользователи", zone: adm, row: 0, col: 0, feature: "Пользователи и роли"}
  - {id: adm_programs, label: "База программ", zone: adm, row: 0, col: 1, feature: "База программ (список)"}
  - {id: adm_schedule, label: "Расписание/АОС", zone: adm, row: 0, col: 2, feature: "Расписание и AOS"}
  - {id: adm_pt, label: "Практические задания", zone: adm, row: 0, col: 3, feature: "Практические задания — админка"}
  - {id: adm_test_constructor, label: "Конструктор тестов", zone: adm, row: 0, col: 4, feature: "Конструктор тестов (админка)"}
  - {id: adm_polls, label: "Опросы", zone: adm, row: 0, col: 5, feature: "Опросы"}
  - {id: adm_dictionaries, label: "Справочники", zone: adm, row: 0, col: 6, feature: "Справочники"}
  - {id: adm_stats, label: "Статистика", zone: adm, row: 0, col: 7, feature: "Статистика обучения"}
  - {id: adm_certificates, label: "Сертификаты", zone: adm, row: 0, col: 8, feature: "Сертификаты — шаблоны и выдача"}
  - {id: adm_notifications, label: "Уведомления", zone: adm, row: 0, col: 9, feature: "Уведомления"}
  - {id: adm_tickets, label: "Тикеты", zone: adm, row: 0, col: 10, feature: "Тикеты — обработка"}
  - {id: adm_kb, label: "База знаний", zone: adm, row: 0, col: 11, feature: "База знаний — админка"}
  - {id: adm_banner, label: "Инфо-баннер", zone: adm, row: 0, col: 12, feature: "Инфо-баннер"}
  - {id: adm_games, label: "Игровые сессии", zone: adm, row: 0, col: 13, feature: "Игровые сессии"}
  - {id: adm_superadmin, label: "Суперадминка/тенанты", zone: adm, row: 0, col: 14, feature: "Суперадминка / тенанты"}
  - {id: adm_experts, label: "Эксперты", zone: adm, row: 0, col: 15, feature: "Эксперты"}
  - {id: adm_users_card, label: "Карточка пользователя", zone: adm, row: 1, col: 0, feature: "Карточка пользователя"}
  - {id: adm_program, label: "Программа", zone: adm, row: 1, col: 1, feature: "Программа (админка)"}
  - {id: adm_streams, label: "Потоки", zone: adm, row: 2, col: 0, feature: "Потоки"}
  - {id: adm_modules, label: "Модули", zone: adm, row: 3, col: 0, feature: "Модули"}
  - {id: adm_activities, label: "Активности", zone: adm, row: 4, col: 0, feature: "Создание активностей (контент)"}
  # ---------------- Интеграции (узлы по краям схемы) ----------------
  - {id: int_buk, label: "БУК", zone: int, row: 0, col: 0, feature: "БУК (внешние пользователи)", target: adm_users_list}
  - {id: int_cas, label: "CAS", zone: int, row: 1, col: 0, feature: "CAS (единый вход)", target: ext_login}
  - {id: int_alpina, label: "Альпина / МИФ", zone: int, row: 2, col: 0, feature: "Альпина и МИФ (ЭБС)", target: ext_kb}
  - {id: int_lrs, label: "LRS / xAPI", zone: int, row: 3, col: 0, feature: "LRS / xAPI", target: ext_course}
  - {id: int_helpdesk, label: "Helpdesk", zone: int, row: 4, col: 0, feature: "Helpdesk", target: ext_support}
edges:
  # -- Внешка: ствол Вход -> Онбординг -> Личный кабинет -> 6 разделов
  - {from: ext_login, to: ext_onboarding}
  - {from: ext_onboarding, to: ext_lk}
  - {from: ext_lk, to: ext_my_learning}
  - {from: ext_lk, to: ext_kb}
  - {from: ext_lk, to: ext_notifications}
  - {from: ext_lk, to: ext_support}
  - {from: ext_lk, to: ext_profile}
  - {from: ext_lk, to: ext_dashboard}
  - {from: ext_my_learning, to: ext_program}
  - {from: ext_program, to: ext_tab_schedule}
  - {from: ext_program, to: ext_tab_courses}
  - {from: ext_program, to: ext_tab_game}
  - {from: ext_tab_courses, to: ext_course}
  - {from: ext_tab_courses, to: ext_test}
  - {from: ext_tab_courses, to: ext_pt}
  - {from: ext_tab_courses, to: ext_poll}
  - {from: ext_kb, to: ext_kb_list}
  - {from: ext_kb_list, to: ext_material}
  - {from: ext_material, to: ext_achievements}
  - {from: ext_material, to: ext_rating}
  - {from: ext_support, to: ext_ticket}
  - {from: ext_profile, to: ext_certificates}
  - {from: ext_profile, to: ext_documents}
  # -- Проверяющий
  - {from: rev_pt, to: rev_new}
  - {from: rev_pt, to: rev_done}
  - {from: rev_done, to: rev_review}
  # -- Админка
  - {from: adm_users_list, to: adm_users_card}
  - {from: adm_programs, to: adm_program}
  - {from: adm_program, to: adm_streams}
  - {from: adm_streams, to: adm_modules}
  - {from: adm_modules, to: adm_activities}
  # -- Интеграции -> целевой узел
  - {from: int_buk, to: adm_users_list}
  - {from: int_cas, to: ext_login}
  - {from: int_alpina, to: ext_kb}
  - {from: int_lrs, to: ext_course}
  - {from: int_helpdesk, to: ext_support}
